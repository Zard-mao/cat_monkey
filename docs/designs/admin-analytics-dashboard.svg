<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06070D"/>
      <stop offset="0.45" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#11131D"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151B28"/>
      <stop offset="1" stop-color="#0A0E17"/>
    </linearGradient>
    <linearGradient id="pinkBlue" x1="0" y1="0" x2="1" y2="1">
