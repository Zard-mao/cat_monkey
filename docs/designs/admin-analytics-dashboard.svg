    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65F2B4"/>
      <stop offset="1" stop-color="#51D9FF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.32 0 0 0 0 0.85 0 0 0 0 1 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
