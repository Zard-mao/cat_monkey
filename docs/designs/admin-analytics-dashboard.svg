      .title { font: 800 46px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F4F8FF; }
      .h1 { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F4F8FF; }
      .h2 { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F4F8FF; }
      .h3 { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #EEF5FF; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C8D4E5; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; }
      .tiny { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7F8CA3; letter-spacing: 1.8px; }
      .num { font: 900 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; }
      .pill { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #EAF4FF; }
      .line { stroke: rgba(255,255,255,0.12); }
