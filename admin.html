<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkey 朋友圈审核后台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="moments-page" data-page="admin">
    <nav class="nav page-nav" aria-label="主导航">
      <a class="brand" href="index.html">Monkey</a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a class="nav-featured" href="moments.html">朋友圈</a>
        <a href="admin.html" aria-current="page">审核后台</a>
      </div>
    </nav>

    <main class="admin-shell">
      <section class="login-view" id="login-view" aria-labelledby="login-title">
        <div class="login-info">
          <p class="eyebrow">ADMIN ONLY</p>
          <h1>只有审核后台需要登录</h1>
          <p>朋友圈浏览、投稿和互动都不需要登录。审核人员登录后，可以处理待审核 Monkey 照片。</p>
        </div>
        <form class="login-card" id="login-form">
          <p class="eyebrow">REVIEW ACCESS</p>
          <h2 id="login-title">审核后台登录</h2>
          <label>
            <span>审核账号</span>
            <input id="reviewer-username" autocomplete="username" value="monkey_reviewer" required />
          </label>
          <label>
            <span>密码</span>
            <input id="reviewer-password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-action full" type="submit">登录审核后台</button>
          <p class="form-message" id="login-message" role="alert"></p>
          <p class="security-note">审核账号和密码由后台配置，页面不展示默认密码。</p>
        </form>
      </section>

      <section class="review-view" id="review-view" hidden>
        <div class="admin-head">
          <div>
            <p class="eyebrow">REVIEW DESK</p>
            <h1>Monkey 投稿审核</h1>
            <p>通过后进入公开朋友圈；拒绝后普通访客不可见。</p>
          </div>
          <div class="reviewer-state">
            <span>已登录：monkey_reviewer</span>
            <button type="button" id="logout-button">退出</button>
          </div>
        </div>

        <div class="admin-module-tabs" id="admin-module-tabs" role="tablist" aria-label="后台模块">
          <button type="button" data-module="review">投稿审核</button>
          <button type="button" data-module="analytics">数据看板</button>
        </div>

        <section class="admin-module" id="review-module" aria-label="投稿审核">
          <div class="admin-tabs" id="admin-tabs" role="tablist" aria-label="审核状态"></div>
          <div class="review-list" id="review-list"></div>
        </section>

        <section class="admin-module analytics-view" id="analytics-module" aria-label="数据看板" hidden>
          <form class="analytics-filters" id="analytics-filters">
            <label>
              <span>时间范围</span>
              <select id="analytics-range">
                <option value="today">今天</option>
                <option value="yesterday">昨天</option>
                <option value="7">近 7 天</option>
                <option value="30">近 30 天</option>
                <option value="custom">自定义</option>
              </select>
            </label>
            <label>
              <span>开始日期</span>
              <input id="analytics-date-from" type="date" />
            </label>
            <label>
              <span>结束日期</span>
              <input id="analytics-date-to" type="date" />
            </label>
            <label>
              <span>投稿人</span>
              <input id="analytics-nickname" type="search" placeholder="输入昵称筛选" />
            </label>
            <label>
              <span>状态</span>
              <select id="analytics-status">
                <option value="all">全部状态</option>
                <option value="pending">待审核</option>
                <option value="approved">已通过</option>
                <option value="rejected">已拒绝</option>
              </select>
            </label>
            <label>
              <span>排序</span>
              <select id="analytics-sort">
                <option value="createdAt">投稿时间</option>
                <option value="favorite">喜欢数</option>
                <option value="like">点赞数</option>
                <option value="dislike">点踩数</option>
                <option value="totalInteractions">总互动数</option>
              </select>
            </label>
            <label>
              <span>顺序</span>
              <select id="analytics-order">
                <option value="desc">从高到低</option>
                <option value="asc">从低到高</option>
              </select>
            </label>
            <div class="analytics-filter-actions">
              <button class="primary-action" type="submit">查看数据</button>
              <button type="button" id="analytics-reset">重置</button>
            </div>
          </form>

          <p class="form-message" id="analytics-message" role="alert"></p>
          <div class="analytics-summary-grid" id="analytics-summary"></div>
          <div class="analytics-grid">
            <section class="analytics-panel">
              <div class="panel-heading">
                <p class="eyebrow">DAILY</p>
                <h2>每天投稿情况</h2>
              </div>
              <div class="daily-stat-list" id="analytics-daily"></div>
            </section>
            <section class="analytics-panel">
              <div class="panel-heading">
                <p class="eyebrow">POSTS</p>
                <h2>投稿互动明细</h2>
              </div>
              <div class="analytics-post-list" id="analytics-posts"></div>
            </section>
          </div>
        </section>
      </section>
    </main>

    <script src="moments.js"></script>
  </body>
</html>
